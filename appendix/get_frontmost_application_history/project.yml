name: get_frontmost_application_history

targets:
  get_frontmost_application_history:
    settings:
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../src/share
      CLANG_CXX_LANGUAGE_STANDARD: 'c++23'
      OTHER_CFLAGS: '$(inherited) -Wall -Werror'
      OTHER_CPLUSPLUSFLAGS: '$(inherited) -Wall -Werror'
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
    type: tool
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: main.cpp
    dependencies:
      - sdk: CoreFoundation.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
