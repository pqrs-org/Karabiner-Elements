name: Karabiner-GamePadViewer

targets:
  Karabiner-GamePadViewer:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-GamePadViewer
      ASSETCATALOG_COMPILER_APPICON_NAME: KarabinerElements
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../src/share
      CLANG_CXX_LANGUAGE_STANDARD: 'c++23'
      OTHER_CFLAGS: '$(inherited) -Wall -Werror'
      OTHER_CPLUSPLUSFLAGS: '$(inherited) -Wall -Werror'
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: src/Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
      - path: ../../src/apps/localization/swift/AppLanguage.swift
      - path: ../../src/apps/localization/swift/AppLocalization.swift
      - path: ../../src/apps/localization/swift/AppLocalizedText.swift
      - path: ../../src/apps/share/swift/Views/OverlayAlertView.swift
      - path: ../../src/apps/share/swift/Views/OpenSystemSettingsButton.swift
      - path: ../../src/apps/share/swift/Views/SheetCloseButton.swift
      - path: ../../src/apps/share/swift/ApplicationTermination.swift
      - path: ../../vendor/vendor/src/pqrs/osx/autorelease_pool/PQRSOSXAutoreleasePoolImpl.m
        compilerFlags:
          - -Wall
          - -Werror
          - -fno-objc-arc
      - path: Resources
        excludes:
          - .gitignore
          - '*.orig.png'
          - '*.plist.in'
      - path: ../../files/icons/Tamura/KarabinerElements/KarabinerElements.icon
    dependencies:
      - sdk: Foundation.framework
      - sdk: IOKit.framework
