name: Karabiner-GamePadViewer

packages:
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    from: 1.1.1

targets:
  Karabiner-GamePadViewer:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-GamePadViewer
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../src/share
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: src/Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
        compilerFlags:
          - -Wall
          - -Werror
          - '-std=c++23'
      - path: ../../src/apps/share/swift/Views/OverlayAlertView.swift
        compilerFlags:
          - -Wall
          - -Werror
      - path: ../../src/apps/share/swift/Views/OpenSystemSettingsButton.swift
        compilerFlags:
          - -Wall
          - -Werror
      - path: ../../src/apps/share/swift/Views/SheetCloseButton.swift
        compilerFlags:
          - -Wall
          - -Werror
      - path: Resources
        excludes:
          - .gitignore
          - '*.orig.png'
          - '*.plist.in'
      - path: ../../src/apps/share/Resources/app.icns
    dependencies:
      - package: AsyncAlgorithms
      - sdk: IOKit.framework
