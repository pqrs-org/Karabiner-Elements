name: Karabiner-MultitouchExtension

packages:
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    from: 1.1.1
  SettingsAccess:
    url: https://github.com/orchetect/SettingsAccess
    from: 2.1.0

targets:
  Karabiner-MultitouchExtension:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-MultitouchExtension
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../../vendor/vendor/include
      HEADER_SEARCH_PATHS:
        - ../../share
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: src/Bridging-Header.h
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
        compilerFlags:
          - -Wall
          - -Werror
          - '-std=c++23'
      - path: ../share/swift/Views
        compilerFlags:
          - -Wall
          - -Werror
      - path: Resources
        excludes:
          - .gitignore
          - '*.plist.in'
    dependencies:
      - framework: /System/Library/PrivateFrameworks/MultitouchSupport.framework
      - package: AsyncAlgorithms
      - package: SettingsAccess
      - sdk: CoreFoundation.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
