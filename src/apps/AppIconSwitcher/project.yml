name: Karabiner-AppIconSwitcher

targets:
  Karabiner-AppIconSwitcher:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-AppIconSwitcher
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../share
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: src/Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
        compilerFlags:
          - -Wall
          - -Werror
          - '-std=c++23'
      - path: Resources
        excludes:
          - .gitignore
          - '*.plist.in'
      - path: ../share/Resources/icons
        excludes:
          - '*.png'
