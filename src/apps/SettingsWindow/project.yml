name: Karabiner-Elements

packages:
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    from: 1.1.1
  CodeEditor:
    url: https://github.com/ZeeZide/CodeEditor
    from: 1.2.6

targets:
  Karabiner-Elements:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-Elements.Settings
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../share
        - ../../../vendor/duktape-src
        - ../../../vendor/duktape-2.7.0/extras/console
        - ../../../vendor/duktape-2.7.0/extras/module-node
      OTHER_LDFLAGS:
        - ../../../vendor/duktape-src/build/Release/libduktape.a
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER:
        - src/Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
        compilerFlags:
          - -Wall
          - -Werror
          - '-std=c++23'
      - path: ../share/swift
        compilerFlags:
          - -Wall
          - -Werror
      - path: ../../../vendor/vendor/src/pqrs/osx/process_info
      - path: ../../../vendor/vendor/src/pqrs/osx/workspace
      - path: Resources
        excludes:
          - .gitignore
          - '*.orig.png'
          - '*.plist.in'
      - path: ../share/Resources/app.icns
      - path: ../share/Resources/icons
    dependencies:
      - package: AsyncAlgorithms
      - package: CodeEditor
      - sdk: libc++.tbd
