name: Karabiner-EventViewer

targets:
  Karabiner-EventViewer:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-EventViewer
      ASSETCATALOG_COMPILER_APPICON_NAME: EventViewer
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../share
      CLANG_CXX_LANGUAGE_STANDARD: 'c++23'
      OTHER_CFLAGS: '$(inherited) -Wall -Werror'
      OTHER_CPLUSPLUSFLAGS: '$(inherited) -Wall -Werror'
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: src/Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../../vendor/Karabiner-DriverKit-VirtualHIDDevice/include
        - ../../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
      - path: ../localization/swift
      - path: ../share/swift/Views
      - path: ../share/swift/ApplicationTermination.swift
      - path: ../share/swift/Concurrency/PeriodicTimer.swift
      - path: ../../../vendor/vendor/src/pqrs/osx/autorelease_pool/PQRSOSXAutoreleasePoolImpl.m
        compilerFlags:
          - -Wall
          - -Werror
          - -fno-objc-arc
      - path: Resources
        excludes:
          - .gitignore
          - '*.orig.png'
          - '*.plist.in'
          - app.icns
      - path: ../../../files/icons/Tamura/EventViewer/EventViewer.icon
    dependencies:
      - sdk: Carbon.framework
      - sdk: CoreFoundation.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
